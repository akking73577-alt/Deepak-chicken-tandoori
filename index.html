<style>
/* Layout: maroon tandoor hero band, yellow free-delivery ribbon, sticky category rail, two-column dish cards (Q/H/F cells), fixed bottom cart bar that opens a bottom-sheet checkout. */
:root {
  --bg: #190c0a;
  --surface: #251210;
  --surface-2: #331a15;
  --line: #4b2b24;
  --fg: #f8eee1;
  --muted: #c9ad9d;
  --accent: #ffc61a;
  --accent-ink: #2b1200;
  --ok: #5fdc8a;
  --bad: #ff8a7a;
  --scrim: rgba(10, 3, 2, 0.68);
  --brand: #ffc61a;
  --brand-ink: #2b1200;
  --hero-a: #62140d;
  --hero-b: #2a0a07;
  --on-hero: #fff3dc;
  --on-hero-muted: #ecc9b4;
  --hero-ok: #5fdc8a;
  --hero-bad: #ff8a7a;
  --f-display: 'Big Shoulders Display', 'Oswald', 'Arial Narrow', Impact, sans-serif;
  --f-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fff7ea;
    --surface: #ffffff;
    --surface-2: #f7ebd8;
    --line: #e4d0b3;
    --fg: #2b1511;
    --muted: #7b5d52;
    --accent: #8c1d13;
    --accent-ink: #fff3dc;
    --ok: #17803d;
    --bad: #b3261e;
    --scrim: rgba(43, 21, 17, 0.5);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #fff7ea;
  --surface: #ffffff;
  --surface-2: #f7ebd8;
  --line: #e4d0b3;
  --fg: #2b1511;
  --muted: #7b5d52;
  --accent: #8c1d13;
  --accent-ink: #fff3dc;
  --ok: #17803d;
  --bad: #b3261e;
  --scrim: rgba(43, 21, 17, 0.5);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
body.lock { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hero :focus-visible, .ribbon :focus-visible, .footer :focus-visible { outline-color: var(--brand); }

.wrap {
  width: 100%;
  max-width: 980px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Hero ---------- */
.hero {
  background:
    radial-gradient(90% 120% at 100% 0%, rgba(255, 140, 40, 0.30), transparent 60%),
    linear-gradient(165deg, var(--hero-a), var(--hero-b));
  color: var(--on-hero);
}
.hero .wrap { padding-block: 34px 36px; display: grid; gap: 20px; justify-items: center; text-align: center; }
.eyebrow {
  font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--on-hero-muted);
}
h1 { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; text-align: center; display: grid; gap: 10px; justify-items: center; width: 100%; }
h1 .big {
  display: block; font-size: clamp(72px, 22vw, 170px); line-height: 1; color: var(--brand);
  letter-spacing: 0.06em; padding-left: 0.06em; text-shadow: 0 4px 28px rgba(255, 150, 40, 0.35);
}
h1 .small {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  font-size: clamp(22px, 6.2vw, 44px); line-height: 1.1; font-weight: 800; letter-spacing: 0.16em; color: var(--on-hero);
}
h1 .small::before, h1 .small::after { content: ""; height: 2px; width: clamp(18px, 7vw, 64px); background: var(--brand); opacity: 0.75; flex: none; }
.hero-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
.status {
  display: flex; align-items: center; gap: 12px; min-width: 0;
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 243, 220, 0.2);
  border-radius: 14px; padding: 10px 16px 10px 14px;
}
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--hero-bad); flex: none; }
.status.is-open .dot { background: var(--hero-ok); box-shadow: 0 0 0 5px rgba(95, 220, 138, 0.22); }
.status-t { font-weight: 700; font-size: 16px; line-height: 1.25; }
.status-s { font-size: 13px; color: var(--on-hero-muted); font-variant-numeric: tabular-nums; }
.hours { font-size: 13px; color: var(--on-hero-muted); font-variant-numeric: tabular-nums; align-self: center; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1.5px solid transparent;
  font-weight: 700; font-size: 15px; text-decoration: none; background: none;
}
.btn-brand { background: var(--brand); color: var(--brand-ink); }
.btn-ghost-hero { border-color: rgba(255, 243, 220, 0.4); color: var(--on-hero); }
.btn-line { border-color: var(--line); background: var(--surface); color: var(--fg); }
.btn-line:hover { border-color: var(--accent); }

.ribbon { background: var(--brand); color: var(--brand-ink); }
.ribbon .wrap { padding-block: 9px; display: flex; flex-wrap: wrap; justify-content: center; column-gap: 18px; font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; }

/* ---------- Category rail ---------- */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; text-decoration: none; font-size: 14px; font-weight: 600; white-space: nowrap;
  padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------- Menu ---------- */
.menu .wrap { padding-block: 22px 8px; }
.legend { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 6px; }
.legend b { color: var(--fg); font-weight: 700; }
.cat { scroll-margin-top: calc(64px + env(safe-area-inset-top, 0px)); padding-top: 22px; }
.cat-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.cat-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 32px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--accent); text-wrap: balance; line-height: 1; }
.cat-meta { font-size: 12px; letter-spacing: 0.16em; font-weight: 700; color: var(--muted); }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 13px 12px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.item h3 { font-size: 16px; font-weight: 700; line-height: 1.3; text-transform: uppercase; letter-spacing: 0.04em; }
.sizes { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; }
.cell { background: var(--surface-2); border: 1.5px solid transparent; border-radius: 10px; padding: 8px 6px 6px; display: grid; gap: 6px; align-content: start; justify-items: stretch; text-align: center; }
.cell.on { border-color: var(--accent); }
.cell.na { opacity: 0.45; align-content: start; }
.sz { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.pr { display: block; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.add {
  height: 38px; border-radius: 8px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
  font-weight: 700; font-size: 14px;
}
.add:hover { background: var(--accent); color: var(--accent-ink); }
.step { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 38px; background: var(--accent); color: var(--accent-ink); border-radius: 8px; overflow: hidden; }
.step button { height: 100%; min-width: 30px; border: 0; background: transparent; color: inherit; font-size: 20px; font-weight: 700; line-height: 1; padding: 0 4px; }
.step button:active { background: rgba(0, 0, 0, 0.15); }
.step output { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 20px; text-align: center; font-size: 15px; }
.step :focus-visible { outline-color: var(--accent-ink); outline-offset: -4px; }

/* ---------- Find us + footer ---------- */
.find .wrap { padding-block: 30px 8px; }
.find-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; }
.find-card h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); line-height: 1; }
.num { font-family: var(--f-display); font-weight: 800; font-size: clamp(40px, 11vw, 56px); letter-spacing: 0.04em; line-height: 1; font-variant-numeric: tabular-nums; user-select: all; }
.find-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.handles { font-size: 13px; color: var(--muted); }

.footer { margin-top: 30px; background: linear-gradient(165deg, var(--hero-a), var(--hero-b)); color: var(--on-hero); text-align: center; }
.footer .wrap { padding-block: 34px calc(120px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; justify-items: center; }
.footer .free { font-family: var(--f-display); font-weight: 900; font-size: clamp(44px, 13vw, 84px); line-height: 0.9; text-transform: uppercase; color: var(--brand); letter-spacing: 0.02em; }
.footer .minl { font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 6vw, 34px); text-transform: uppercase; letter-spacing: 0.06em; }
.footer .fine { font-size: 13px; color: var(--on-hero-muted); font-variant-numeric: tabular-nums; }
.footer .thanks { display: grid; gap: 6px; justify-items: center; margin-top: 16px; padding-top: 20px; border-top: 1px solid rgba(255, 243, 220, 0.22); width: 100%; max-width: 460px; }
.footer .thanks-h { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 8vw, 40px); letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.05; }
.footer .thanks-p { font-size: 15px; color: var(--on-hero-muted); max-width: 36ch; text-wrap: balance; }
.footer .credit { margin-top: 18px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--on-hero-muted); opacity: 0.8; }

/* ---------- Cart bar ---------- */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 92%, transparent); border-top: 1px solid var(--line);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.bar-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 980px; margin: 0 auto;
  min-height: 56px; padding: 8px 18px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); text-align: left;
}
.bar-l { display: grid; line-height: 1.2; min-width: 0; }
.bar-l strong { font-size: 18px; font-variant-numeric: tabular-nums; }
.bar-l span { font-size: 12.5px; font-weight: 600; opacity: 0.85; }
.bar-r { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; display: flex; flex-direction: column;
  max-height: 94vh; max-height: 94dvh; background: var(--bg); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.35);
}
@media (min-width: 700px) { .sheet { left: 50%; right: auto; width: 580px; transform: translateX(-50%); } }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line);
}
.sheet-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.sheet-body {
  overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 16px; align-content: start;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.notice { border: 1px solid var(--bad); color: var(--bad); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; display: grid; gap: 14px; justify-items: center; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "info total" "step step"; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.line:first-child { padding-top: 0; }
.line-info { grid-area: info; min-width: 0; }
.line-name { font-weight: 700; line-height: 1.3; text-transform: uppercase; letter-spacing: 0.03em; font-size: 14px; }
.line-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.line .step { grid-area: step; width: 128px; height: 36px; }
.line-total { grid-area: total; font-weight: 700; font-variant-numeric: tabular-nums; align-self: start; }
@media (min-width: 440px) {
  .line { grid-template-columns: minmax(0, 1fr) auto 72px; grid-template-areas: "info step total"; }
  .line-total { text-align: right; align-self: center; }
}
.totals { display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.trow { display: flex; justify-content: space-between; gap: 12px; }
.trow.grand { font-size: 19px; font-weight: 700; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.trow .free-t { color: var(--ok); font-weight: 700; }
.meter { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; }
.meter-t { font-size: 13px; color: var(--muted); margin-top: 6px; }
.meter-t.done { color: var(--ok); font-weight: 600; }
.form { display: grid; gap: 14px; }
.form h3 { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; }
.field label small { font-weight: 500; color: var(--muted); }
.field input, .field textarea {
  width: 100%; font-size: 16px; padding: 12px 13px; border-radius: 10px; background: var(--surface); border: 1.5px solid var(--line); resize: vertical;
}
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: 0.8; }
.field.bad input, .field.bad textarea { border-color: var(--bad); }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }
.wa {
  display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; border-radius: 14px; text-decoration: none;
  background: #1fa855; color: #04210f; font-weight: 700; font-size: 17px; border: 0;
}
.wa.is-disabled { background: var(--surface-2); color: var(--muted); pointer-events: none; }
.why { font-size: 14px; font-weight: 600; color: var(--bad); text-align: center; }
.hint { font-size: 13px; color: var(--muted); text-align: center; }
.sec-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.link-btn { background: none; border: 0; padding: 8px 6px; font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.link-btn:disabled { opacity: 0.4; cursor: default; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60; bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: calc(100% - 32px); text-align: center;
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
}
.sheet-open .toast { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
</style>
